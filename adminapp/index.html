<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rev Moto — Mobile Admin App Simulator</title>
  <meta name="description" content="Live mobile app preview and simulator for Rev Moto Admin APK.">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0a0f1d;
      --bg-panel: #111827;
      --accent-blue: #2563eb;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --phone-width: 390px;
      --phone-height: 844px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Simulator Navigation Header (Desktop) */
    .sim-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .sim-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .sim-logo {
      height: 28px;
      width: auto;
    }

    .sim-title {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sim-badge {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #60a5fa;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sim-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sim-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .sim-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .sim-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.35);
    }

    .sim-btn-primary {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-color: rgba(59, 130, 246, 0.5);
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(37, 99, 235, 0.3);
    }

    .sim-btn-primary:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.45);
    }

    .sim-device-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .sim-device-select option {
      background: #0f172a;
      color: #ffffff;
    }

    /* Main Simulator Stage */
    .sim-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      min-height: calc(100vh - 65px);
    }

    /* Smartphone Device Frame */
    .phone-mockup {
      width: var(--phone-width);
      height: var(--phone-height);
      max-height: 90vh;
      background: #050811;
      border-radius: 48px;
      box-shadow: 
        0 0 0 10px #1e293b,
        0 0 0 12px #334155,
        0 0 0 14px rgba(15, 23, 42, 0.8),
        0 24px 70px rgba(0, 0, 0, 0.6),
        0 10px 30px rgba(37, 99, 235, 0.15);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease;
    }

    /* Phone Punch-Hole Camera */
    .phone-camera-hole {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: #000000;
      border: 1.5px solid #1e293b;
      border-radius: 50%;
      z-index: 50;
      pointer-events: none;
    }

    /* Realistic Android Status Bar */
    .phone-status-bar {
      height: 28px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #e2e8f0;
      z-index: 40;
      flex-shrink: 0;
      user-select: none;
      letter-spacing: 0.02em;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
    }

    /* App Screen Iframe Container */
    .phone-screen {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }

    .app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Bottom Android Navigation Pill */
    .phone-nav-bar {
      height: 18px;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      user-select: none;
    }

    .nav-pill {
      width: 90px;
      height: 4px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 99px;
    }

    /* Fullscreen Mode (When user toggles Fullscreen on Desktop) */
    body.is-fullscreen .sim-header {
      display: none;
    }

    body.is-fullscreen .sim-stage {
      padding: 0;
      height: 100vh;
      min-height: 100vh;
    }

    body.is-fullscreen .phone-mockup {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body.is-fullscreen .phone-camera-hole,
    body.is-fullscreen .phone-status-bar,
    body.is-fullscreen .phone-nav-bar {
      display: none;
    }

    /* Exit Fullscreen Floating Button */
    .exit-fullscreen-btn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-subtle);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 0.76rem;
      font-weight: 700;
      z-index: 99999;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    body.is-fullscreen .exit-fullscreen-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ═══════════════════════════════════════════════════════════════
       MOBILE DEVICE VIEW (<= 768px):
       When accessed on mobile phone, automatically take 100% full screen
       so it feels exactly like the native mobile app!
       ═══════════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .sim-header {
        display: none !important;
      }
      .sim-stage {
        padding: 0 !important;
        height: 100vh !important;
        min-height: 100vh !important;
      }
      .phone-mockup {
        width: 100vw !important;
        height: 100vh !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .phone-camera-hole,
      .phone-status-bar,
      .phone-nav-bar {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Simulator Top Controls Toolbar (Desktop) -->
  <header class="sim-header" id="simHeader">
    <div class="sim-brand">
      <img src="../assets/images/logo.png" alt="REV MOTO" class="sim-logo">
      <div class="sim-title">
        REV MOTO <span style="color: var(--accent-cyan);">APP</span>
        <span class="sim-badge">Mobile Simulator</span>
      </div>
    </div>

    <div class="sim-controls">
      <!-- Device Model Presets -->
      <select class="sim-device-select" id="deviceSelect" onchange="changeDevicePreset(this.value)">
        <option value="android-standard" selected>Android Phone (390 × 844)</option>
        <option value="pixel-7">Google Pixel (412 × 915)</option>
        <option value="compact-phone">Compact Phone (360 × 760)</option>
      </select>

      <!-- Reload Screen -->
      <button class="sim-btn" onclick="reloadApp()" title="Reload Mobile App">
        <i class="fas fa-arrows-rotate"></i> <span>Refresh</span>
      </button>

      <!-- Toggle Fullscreen -->
      <button class="sim-btn" id="toggleFullscreenBtn" onclick="toggleFullscreen()" title="Toggle Fullscreen View">
        <i class="fas fa-expand"></i> <span>Fullscreen</span>
      </button>

      <!-- Direct Admin Link -->
      <a href="../admin/index.html" class="sim-btn" title="Open Full Desktop Admin">
        <i class="fas fa-desktop"></i> <span>Desktop View</span>
      </a>

      <!-- Download APK Button -->
      <a href="../rev-moto-admin.apk" download class="sim-btn sim-btn-primary" title="Download Installable Android APK">
        <i class="fab fa-android"></i> <span>Download APK</span>
      </a>
    </div>
  </header>

  <!-- Main Stage / Device Mockup -->
  <main class="sim-stage">
    <div class="phone-mockup" id="phoneMockup">
      <!-- Punch Hole Camera -->
      <div class="phone-camera-hole"></div>

      <!-- Android Top Status Bar -->
      <div class="phone-status-bar">
        <div class="status-left">
          <span id="liveClock">7:50 PM</span>
          <i class="fab fa-youtube" style="font-size: 0.62rem; color: #94a3b8;"></i>
          <i class="fab fa-whatsapp" style="font-size: 0.62rem; color: #10b981;"></i>
        </div>
        <div class="status-right">
          <span style="font-size: 0.60rem; font-weight: 800;">4G</span>
          <i class="fas fa-wifi"></i>
          <i class="fas fa-battery-full" style="color: #10b981;"></i>
          <span>98%</span>
        </div>
      </div>

      <!-- Live App Screen (Iframe embedding live admin portal) -->
      <div class="phone-screen">
        <iframe 
          id="appIframe" 
          class="app-iframe" 
          src="../admin/index.html" 
          title="Rev Moto Admin App"
          allow="clipboard-write; notifications">
        </iframe>
      </div>

      <!-- Bottom Android Gesture Navigation Bar -->
      <div class="phone-nav-bar">
        <div class="nav-pill"></div>
      </div>
    </div>
  </main>

  <!-- Floating Exit Fullscreen Button -->
  <button class="exit-fullscreen-btn" onclick="toggleFullscreen()">
    <i class="fas fa-compress"></i> <span>Exit Fullscreen</span>
  </button>

  <script>
    // Live Clock updater in Status Bar
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const clockEl = document.getElementById('liveClock');
      if (clockEl) clockEl.textContent = `${hours}:${minutes} ${ampm}`;
    }
    updateClock();
    setInterval(updateClock, 15000);

    // Device Size Presets
    const presets = {
      'android-standard': { width: '390px', height: '844px' },
      'pixel-7': { width: '412px', height: '915px' },
      'compact-phone': { width: '360px', height: '760px' }
    };

    function changeDevicePreset(presetKey) {
      const p = presets[presetKey] || presets['android-standard'];
      const phone = document.getElementById('phoneMockup');
      if (phone) {
        phone.style.setProperty('--phone-width', p.width);
        phone.style.setProperty('--phone-height', p.height);
        phone.style.width = p.width;
        phone.style.height = p.height;
      }
    }

    // Reload App Iframe
    function reloadApp() {
      const iframe = document.getElementById('appIframe');
      if (iframe) {
        const currentSrc = iframe.src.split('?')[0];
        iframe.src = currentSrc + '?t=' + Date.now();
      }
    }

    // Toggle Fullscreen View
    function toggleFullscreen() {
      document.body.classList.toggle('is-fullscreen');
      const btn = document.getElementById('toggleFullscreenBtn');
      if (btn) {
        if (document.body.classList.contains('is-fullscreen')) {
          btn.classList.add('active');
          btn.innerHTML = '<i class="fas fa-compress"></i> <span>Exit Fullscreen</span>';
        } else {
          btn.classList.remove('active');
          btn.innerHTML = '<i class="fas fa-expand"></i> <span>Fullscreen</span>';
        }
      }
    }

    // Check URL params for ?mode=fullscreen
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'fullscreen') {
      toggleFullscreen();
    }
  </script>

</body>
</html>
